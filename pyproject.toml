[project]
name = "rag-tutor"
version = "0.1.0"
description = "Interactive educational RAG curriculum and playground built with Python, Marimo, DuckDB, and Llama-macOS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.9.0",
    "duckdb>=1.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_tutor"]
